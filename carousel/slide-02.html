<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1350px;
  background: #0F0F13;
  color: #E0E0E6;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 100px;
  position: relative;
  overflow: hidden;
}
.label {
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: #6366F1;
  margin-bottom: 24px;
  font-weight: 600;
}
h1 {
  font-size: 52px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1px;
  margin-bottom: 64px;
}
.stats {
  display: flex;
  flex-direction: column;
  gap: 40px;
}
.stat {
  display: flex;
  align-items: baseline;
  gap: 20px;
}
.stat .number {
  font-size: 64px;
  font-weight: 800;
  background: linear-gradient(135deg, #6366F1, #EC4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  min-width: 220px;
  text-align: right;
}
.stat .desc {
  font-size: 24px;
  color: #9CA3AF;
  line-height: 1.3;
}
.footer-note {
  margin-top: 64px;
  font-size: 20px;
  color: #6B7280;
  line-height: 1.6;
  max-width: 720px;
  border-left: 3px solid #6366F1;
  padding-left: 24px;
}
.brand {
  position: absolute;
  bottom: 60px;
  left: 0;
  right: 0;
  text-align: center;
}
.brand .logo {
  font-size: 18px;
  color: #9CA3AF;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 600;
}
.brand .dots {
  margin-top: 12px;
  font-size: 14px;
  color: #4B5563;
  letter-spacing: 4px;
}
</style>
</head>
<body>
<div>
  <div class="label">The Data</div>
  <h1>The dataset</h1>
  <div class="stats">
    <div class="stat">
      <div class="number">302</div>
      <div class="desc">episodes of Lenny's Podcast</div>
    </div>
    <div class="stat">
      <div class="number">280+</div>
      <div class="desc">product leaders analyzed</div>
    </div>
    <div class="stat">
      <div class="number">186K</div>
      <div class="desc">lines of conversation</div>
    </div>
  </div>
  <div class="footer-note">
    Analyzed with AI to extract leadership patterns, frameworks, and decision-making styles
  </div>
</div>
<div class="brand">
  <div class="logo">PM Genome</div>
  <div class="dots">2 / 10</div>
</div>
</body>
</html>
