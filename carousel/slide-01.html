<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1350px;
  background: #0F0F13;
  color: #E0E0E6;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px;
  position: relative;
  overflow: hidden;
}
.hook {
  text-align: center;
  max-width: 860px;
}
.hook h1 {
  font-size: 56px;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -1px;
  margin-bottom: 40px;
  background: linear-gradient(135deg, #6366F1, #EC4899, #F59E0B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hook .subtitle {
  font-size: 28px;
  color: #9CA3AF;
  margin-top: 20px;
  letter-spacing: 1px;
}
.brand {
  position: absolute;
  bottom: 60px;
  left: 0;
  right: 0;
  text-align: center;
}
.brand .logo {
  font-size: 18px;
  color: #9CA3AF;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 600;
}
.brand .dots {
  margin-top: 12px;
  font-size: 14px;
  color: #4B5563;
  letter-spacing: 4px;
}
.accent-line {
  width: 60px;
  height: 4px;
  background: linear-gradient(90deg, #6366F1, #EC4899);
  border-radius: 2px;
  margin: 0 auto 40px;
}
</style>
</head>
<body>
<div class="hook">
  <div class="accent-line"></div>
  <h1>I analyzed 302 podcast transcripts and discovered 7 types of product leader</h1>
  <p class="subtitle">Here's what I found &rarr;</p>
</div>
<div class="brand">
  <div class="logo">PM Genome</div>
  <div class="dots">1 / 10</div>
</div>
</body>
</html>
