<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1350px;
  background: #0F0F13;
  color: #E0E0E6;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px;
  position: relative;
  overflow: hidden;
}
.content {
  text-align: center;
  max-width: 860px;
}
.accent-line {
  width: 60px;
  height: 4px;
  background: linear-gradient(90deg, #6366F1, #EC4899);
  border-radius: 2px;
  margin: 0 auto 48px;
}
h1 {
  font-size: 56px;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -1px;
  margin-bottom: 32px;
  background: linear-gradient(135deg, #6366F1, #EC4899, #F59E0B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  font-size: 24px;
  color: #9CA3AF;
  line-height: 1.5;
  margin-bottom: 64px;
}
.url-box {
  display: inline-block;
  padding: 24px 56px;
  border-radius: 16px;
  background: rgba(99, 102, 241, 0.1);
  border: 2px solid rgba(99, 102, 241, 0.3);
  margin-bottom: 32px;
}
.url-box .url {
  font-size: 32px;
  font-weight: 700;
  color: #6366F1;
  letter-spacing: 1px;
}
.time {
  font-size: 20px;
  color: #6B7280;
  margin-top: 24px;
}
.brand {
  position: absolute;
  bottom: 60px;
  left: 0;
  right: 0;
  text-align: center;
}
.brand-main {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #6366F1, #EC4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.brand .dots {
  margin-top: 12px;
  font-size: 14px;
  color: #4B5563;
  letter-spacing: 4px;
}
</style>
</head>
<body>
<div class="content">
  <div class="accent-line"></div>
  <h1>Find your product leadership DNA</h1>
  <div class="subtitle">24 scenarios. 8 minutes. No wrong answers.</div>
  <div class="url-box">
    <div class="url">pm-genome.pages.dev</div>
  </div>
  <div class="time">Free. No signup required.</div>
</div>
<div class="brand">
  <div class="brand-main">PM GENOME</div>
  <div class="dots">10 / 10</div>
</div>
</body>
</html>
